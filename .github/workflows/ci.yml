name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-bot
    strategy:
      matrix:
        node-version: ['20', '22']

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: my-bot/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signal-factory
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install signal-factory
        run: pip install -e .
      - name: Install test deps
        run: pip install pytest
      - name: Run unit tests
        run: pytest tests -q